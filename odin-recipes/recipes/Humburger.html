    <h1>ハンバーガー</h1>

    <h2>材料</h2>
    <ul>
        <li>バンズ</li>
        <li>チキン</li>
        <li>キャベツ</li>
        <li>美味しいソース</li>
    </ul>
    <h2>作り方</h2>
    <ol>
        <li>バンズを焼く</li>
        <li>他のレシピサイトを見てチキンを揚げる</li>
        <li>キャベツを切る</li>
        <li>よさげなレシピサイトを見てソースを作る</li>
        <li>具材をはさむ</li>
        <li>その辺の人の両耳に当てる</li>
    </ol>
    <img src="Bakasandwitch.jpg" alt="ゴードン・ラムゼイ" width="350" height="320">
    <h2>シェフのコメント</h2>
    <p>両耳がべたついてるんですけど。あれってパンだけで挟むものじゃないんですか…。好きなハンバーガーはケンタッキーの鶏竜田バーガー。</p>
